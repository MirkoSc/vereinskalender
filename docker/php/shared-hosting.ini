; Mirrors typical shared hosting restrictions (CLAUDE.md sections 2 and 12).
disable_functions = exec,passthru,popen,proc_open,shell_exec,system,pcntl_exec
memory_limit = 256M
max_execution_time = 30
upload_max_filesize = 64M
post_max_size = 64M
expose_php = Off

; Keep function arguments OUT of exception stack traces (analog to
; php.ini-production). A logged trace of a failing login would otherwise
; carry the plaintext password as a call argument (CLAUDE.md section 5,
; "Passwörter nie loggen"). The error handler in Http/Kernel additionally
; never logs the full exception string, so the guarantee holds even on a
; host that leaves this off (defense in depth).
zend.exception_ignore_args = On

; Deliberately NOT Europe/Berlin: only bootstrap may set the timezone, so
; any code path bypassing bootstrap shows up as a time offset in dev.
date.timezone = UTC

; Dev convenience (production has this off).
display_errors = On
