# Release build (CLAUDE.md section 10): a tag vX.Y.Z builds the release ZIP,
# checksums.txt and setup.php and publishes them as a pre-release.
# Alternatively started by hand or by the development workflow
# (workflow_dispatch on main, docs/VORGEHEN.md) with a version: then the
# publish step creates the tag itself on the built commit. Needed because
# the Claude Code sessions may push branches but not tags.
# Structure taken over from the sister project Mitgliederverwaltung.
name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without "v", e.g. 7.9.0'
        required: true
        type: string

# Read-only by default: only the publish job may write. The build job runs
# composer and the ZIP tooling without write access.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      # The release tag: the pushed tag, or "v" + the version given by hand.
      # The input only reaches the shell through env, never inlined.
      - name: Determine release tag
        id: tag
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            if [ "$REF" != "refs/heads/main" ]; then
              echo "Manual releases only from main" >&2; exit 1
            fi
            TAG="v${INPUT_VERSION}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "Invalid version: $TAG" >&2; exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_mysql, zip
          coverage: none

      - name: Install production dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --no-progress

      - name: Write VERSION from tag
        run: echo "${RELEASE_TAG#v}" > VERSION

      - name: Build release ZIP
        run: |
          mkdir -p dist
          zip -r "dist/vereinskalender-${RELEASE_TAG}.zip" \
            app public vendor bin migrations VERSION

      # Rebuilt from the tagged sources rather than trusting the committed
      # copy (CI checks that the two agree).
      - name: Stage setup.php
        run: php bin/build_setup.php && cp setup.php dist/

      - name: Generate checksums
        run: cd dist && sha256sum * > checksums.txt

      - name: Hand the release files to the publish job
        uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist

      # Every release starts as a pre-release for the beta test instance;
      # promoting it to "latest" for the stable channel is a manual step in
      # the GitHub UI (CLAUDE.md section 10). A manual run must not add
      # files to an existing release; a pushed tag may already have one
      # (draft), then the files are added to it.
      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          EVENT: ${{ github.event_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [ "$EVENT" = "workflow_dispatch" ]; then
              echo "Release $TAG already exists" >&2; exit 1
            fi
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" \
              --prerelease --title "$TAG" --generate-notes --target "$GITHUB_SHA"
          fi
